<!DOCTYPE html>
<html>
<head>
    <title>Debug Auth - Auto Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { margin: 5px; padding: 10px 15px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔧 Debug de Autenticación - Auto Login</h1>
    <div id="status"></div>
    
    <div>
        <button onclick="checkCookies()">🍪 Verificar Cookies</button>
        <button onclick="doAutoLogin()">🔑 Auto Login</button>
        <button onclick="testMenu()">📋 Probar Menú</button>
        <button onclick="clearCookies()">🗑️ Limpiar Cookies</button>
        <button onclick="goToApp()">🚀 Ir a la App</button>
    </div>
    
    <script>
        function addStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = message;
            statusDiv.appendChild(div);
        }
        
        function clearStatus() {
            document.getElementById('status').innerHTML = '';
        }
        
        function checkCookies() {
            clearStatus();
            const accessToken = getCookie('access_token');
            const refreshToken = getCookie('refresh_token');
            const user = getCookie('user');
            
            addStatus(`
                <h3>🍪 Estado de Cookies:</h3>
                <p><strong>Access Token:</strong> ${accessToken ? '✅ PRESENTE' : '❌ AUSENTE'}</p>
                <p><strong>Refresh Token:</strong> ${refreshToken ? '✅ PRESENTE' : '❌ AUSENTE'}</p>
                <p><strong>User:</strong> ${user ? '✅ PRESENTE' : '❌ AUSENTE'}</p>
                ${accessToken ? `<p><strong>Token Preview:</strong> ${accessToken.substring(0, 50)}...</p>` : ''}
            `, accessToken && refreshToken && user ? 'success' : 'error');
        }
        
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }
        
        function setCookie(name, value, days) {
            const expires = new Date();
            expires.setTime(expires.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${value}; expires=${expires.toUTCString()}; path=/; SameSite=Lax`;
        }
        
        function clearCookies() {
            clearStatus();
            document.cookie = 'access_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            document.cookie = 'refresh_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            document.cookie = 'user=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            addStatus('🗑️ Cookies eliminadas correctamente', 'success');
        }
        
        async function doAutoLogin() {
            clearStatus();
            addStatus('🔄 Iniciando login automático...', 'info');
            
            try {
                const response = await fetch('http://localhost:8000/api/v1/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin123'
                    })
                });
                
                const data = await response.json();
                console.log('🔍 Login response:', data);
                
                if (data.success && data.data) {
                    // Guardar tokens en cookies con la misma configuración que usa la app
                    setCookie('access_token', data.data.access, 1); // 1 día
                    setCookie('refresh_token', data.data.refresh, 7); // 7 días
                    setCookie('user', JSON.stringify(data.data.user), 7); // 7 días
                    
                    addStatus(`
                        <h3>✅ Login exitoso!</h3>
                        <p><strong>Usuario:</strong> ${data.data.user.username}</p>
                        <p><strong>Empleado:</strong> ${data.data.user.empleado ? data.data.user.empleado.nombres + ' ' + data.data.user.empleado.ape_paterno : 'N/A'}</p>
                        <p><strong>Roles:</strong> ${data.data.user.roles ? data.data.user.roles.map(r => r.nombre).join(', ') : 'N/A'}</p>
                        <p>🍪 Cookies guardadas correctamente</p>
                        <p>🚀 Ahora puedes ir a la aplicación</p>
                    `, 'success');
                } else {
                    addStatus(`❌ Error en login: ${data.message || 'Error desconocido'}`, 'error');
                }
            } catch (error) {
                console.error('❌ Error:', error);
                addStatus(`❌ Error de conexión: ${error.message}`, 'error');
            }
        }
        
        async function testMenu() {
            clearStatus();
            const accessToken = getCookie('access_token');
            if (!accessToken) {
                addStatus('❌ No hay token de acceso. Haz login primero.', 'error');
                return;
            }
            
            addStatus('🔄 Probando endpoint del menú...', 'info');
            
            try {
                const response = await fetch('http://localhost:8000/api/v1/auth/menu/', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                console.log('🔍 Menu response:', data);
                
                if (data.success) {
                    addStatus(`
                        <h3>✅ Menú obtenido correctamente!</h3>
                        <p><strong>Elementos del menú:</strong> ${data.data.length}</p>
                        <pre>${JSON.stringify(data.data, null, 2)}</pre>
                    `, 'success');
                } else {
                    addStatus(`❌ Error al obtener menú: ${data.message}`, 'error');
                }
            } catch (error) {
                console.error('❌ Error:', error);
                addStatus(`❌ Error al obtener menú: ${error.message}`, 'error');
            }
        }
        
        function goToApp() {
            window.open('http://localhost:5173/', '_blank');
        }
        
        // Auto-ejecutar verificación de cookies al cargar
        window.onload = function() {
            checkCookies();
            addStatus('💡 <strong>Instrucciones:</strong><br>1. Haz clic en "Auto Login" para autenticarte<br>2. Verifica que las cookies se hayan guardado<br>3. Haz clic en "Ir a la App" para abrir la aplicación', 'info');
        };
    </script>
</body>
</html>

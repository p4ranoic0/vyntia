<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Simple Login</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        button { background: #1976d2; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin: 5px; }
        input { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Test Simple Login</h1>
    
    <div>
        <input type="text" id="username" placeholder="Username" value="admin">
        <input type="password" id="password" placeholder="Password" value="admin123">
        <button onclick="testLogin()">Login</button>
        <button onclick="checkCookies()">Check Cookies</button>
        <button onclick="clearCookies()">Clear Cookies</button>
    </div>
    
    <div id="results"></div>

    <script>
        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
            results.appendChild(div);
        }

        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            log('🔄 Iniciando login...');
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });
                
                log(`📡 Status: ${response.status}`);
                
                // Mostrar headers de respuesta
                const headers = {};
                for (let [key, value] of response.headers.entries()) {
                    headers[key] = value;
                }
                log(`📋 Response Headers: <pre>${JSON.stringify(headers, null, 2)}</pre>`);
                
                const data = await response.json();
                
                if (response.ok) {
                    log(`✅ Login exitoso: <pre>${JSON.stringify(data, null, 2)}</pre>`, 'success');
                    
                    // Verificar cookies inmediatamente
                    setTimeout(checkCookies, 100);
                } else {
                    log(`❌ Login falló: <pre>${JSON.stringify(data, null, 2)}</pre>`, 'error');
                }
            } catch (error) {
                log(`💥 Error: ${error.message}`, 'error');
            }
        }
        
        function checkCookies() {
            log('🍪 Verificando cookies...');
            
            const allCookies = document.cookie;
            log(`🍪 Todas las cookies: "${allCookies}"`);
            
            if (!allCookies) {
                log('❌ No hay cookies', 'error');
                return;
            }
            
            const cookies = allCookies.split(';').reduce((acc, cookie) => {
                const [name, value] = cookie.trim().split('=');
                acc[name] = value;
                return acc;
            }, {});
            
            log(`🍪 Cookies parseadas: <pre>${JSON.stringify(cookies, null, 2)}</pre>`);
            
            if (cookies.access_token) {
                log(`🔑 Access Token encontrado: ${cookies.access_token.substring(0, 50)}...`, 'success');
            } else {
                log('❌ No se encontró access_token', 'error');
            }
            
            if (cookies.refresh_token) {
                log(`🔄 Refresh Token encontrado: ${cookies.refresh_token.substring(0, 50)}...`, 'success');
            } else {
                log('❌ No se encontró refresh_token', 'error');
            }
        }
        
        function clearCookies() {
            document.cookie = 'access_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            document.cookie = 'refresh_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            document.getElementById('results').innerHTML = '';
            log('🗑️ Cookies limpiadas', 'success');
        }
        
        // Verificar estado inicial
        window.onload = function() {
            log('🚀 Página cargada');
            checkCookies();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Frontend Login Real</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        .info { background: #d1ecf1; }
        .warning { background: #fff3cd; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0056b3; }
        button.danger { background: #dc3545; }
        button.danger:hover { background: #c82333; }
        input {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .log {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .status-item {
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Debug Frontend Login Real</h1>
    
    <div class="container">
        <h3>Simulación Exacta del Frontend</h3>
        <input type="text" id="username" placeholder="Usuario" value="admin">
        <input type="password" id="password" placeholder="Contraseña" value="admin">
        <button onclick="simulateRealLogin()">Simular Login Real</button>
        <button onclick="testAuthServiceDirectly()">Probar AuthService Directo</button>
        <button onclick="clearAll()" class="danger">Limpiar Todo</button>
    </div>

    <div class="grid">
        <div class="container">
            <h3>Estado Actual</h3>
            <button onclick="checkCurrentState()">Verificar Estado</button>
            <div id="currentState" class="status-item"></div>
        </div>

        <div class="container">
            <h3>Flujo de Navegación</h3>
            <button onclick="testNavigation()">Probar Navegación</button>
            <div id="navigationState" class="status-item"></div>
        </div>
    </div>

    <div class="container">
        <h3>Logs Detallados</h3>
        <button onclick="clearLogs()">Limpiar Logs</button>
        <div id="logs" class="log"></div>
    </div>

    <script>
        let logContainer = document.getElementById('logs');
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}\n`;
            logContainer.textContent += logEntry;
            logContainer.scrollTop = logContainer.scrollHeight;
            console.log(message);
        }
        
        function clearLogs() {
            logContainer.textContent = '';
        }
        
        // Funciones de utilidad para cookies (exactas del frontend)
        function setCookie(name, value, days = 7) {
            const expires = new Date();
            expires.setTime(expires.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${value};expires=${expires.toUTCString()};path=/;SameSite=Lax`;
        }
        
        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }
        
        function deleteCookie(name) {
            document.cookie = `${name}=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;`;
        }
        
        function hasAuthCookies() {
            return getCookie('access_token') !== null && getCookie('refresh_token') !== null;
        }
        
        function clearAuthCookies() {
            deleteCookie('access_token');
            deleteCookie('refresh_token');
        }
        
        // Simulación exacta del AuthService del frontend
        class RealAuthService {
            constructor() {
                this.token = null;
                log('AuthService - Constructor iniciado');
                if (hasAuthCookies()) {
                    this.token = getCookie('access_token');
                    log('AuthService - Token encontrado en cookies');
                } else {
                    log('AuthService - No se encontraron cookies de autenticación');
                }
            }
            
            async login(credentials) {
                log('=== AuthService.login() INICIADO ===');
                log(`Credenciales: ${JSON.stringify(credentials)}`);
                
                try {
                    const response = await fetch('http://127.0.0.1:8000/api/v1/auth/login/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(credentials),
                        credentials: 'include'
                    });
                    
                    log(`Respuesta HTTP: ${response.status} ${response.statusText}`);
                    
                    const data = await response.json();
                    log(`Datos recibidos: ${JSON.stringify(data, null, 2)}`);
                    
                    if (response.ok && data.success) {
                        const { access, refresh, user, roles } = data.data;
                        
                        log('=== PROCESANDO RESPUESTA EXITOSA ===');
                        log(`Access Token: ${access ? 'Presente' : 'Ausente'}`);
                        log(`Refresh Token: ${refresh ? 'Presente' : 'Ausente'}`);
                        log(`Usuario: ${JSON.stringify(user)}`);
                        log(`Roles: ${JSON.stringify(roles)}`);
                        
                        // Generar cookies como en el frontend real
                        log('Generando cookies...');
                        setCookie('access_token', access, 1); // 1 día
                        setCookie('refresh_token', refresh, 7); // 7 días
                        
                        this.token = access;
                        
                        // Guardar datos en localStorage como en el frontend real
                        const userData = {
                            user: user,
                            roles: roles || [],
                            permissions: [], // Ya no se usan en el frontend
                            modules: [] // Ya no se usan en el frontend
                        };
                        
                        log('Guardando en localStorage...');
                        localStorage.setItem('user_data', JSON.stringify(userData));
                        
                        log('=== LOGIN EXITOSO COMPLETADO ===');
                        return data;
                    } else {
                        log(`ERROR EN LOGIN: ${data.message}`);
                        throw new Error(data.message || 'Error en el login');
                    }
                } catch (error) {
                    log(`ERROR DE CONEXIÓN: ${error.message}`);
                    throw error;
                }
            }
            
            isAuthenticated() {
                log('=== AuthService.isAuthenticated() ===');
                const userData = localStorage.getItem('user_data');
                const hasValidCookies = hasAuthCookies();
                const result = userData !== null && hasValidCookies;
                
                log(`LocalStorage userData: ${userData ? 'Presente' : 'Ausente'}`);
                log(`Cookies válidas: ${hasValidCookies ? 'SÍ' : 'NO'}`);
                log(`Resultado isAuthenticated: ${result}`);
                
                return result;
            }
            
            getUserData() {
                log('=== AuthService.getUserData() ===');
                const userData = localStorage.getItem('user_data');
                const result = userData ? JSON.parse(userData) : null;
                log(`Datos obtenidos: ${result ? 'Presentes' : 'Ausentes'}`);
                return result;
            }
            
            logout() {
                log('=== AuthService.logout() ===');
                clearAuthCookies();
                localStorage.removeItem('user_data');
                this.token = null;
                log('Logout completado');
            }
        }
        
        const realAuthService = new RealAuthService();
        
        // Simulación exacta del AuthContext
        class MockAuthContext {
            constructor() {
                this.user = null;
                this.roles = [];
                this.permissions = [];
                this.modules = [];
                this.isLoading = true;
                this.isAuthenticated = false;
                
                this.initialize();
            }
            
            initialize() {
                log('=== AuthContext - INICIALIZACIÓN ===');
                
                if (realAuthService.isAuthenticated()) {
                    const userData = realAuthService.getUserData();
                    if (userData) {
                        log('AuthContext - Datos de usuario encontrados');
                        this.user = userData.user;
                        this.roles = userData.roles || [];
                        this.permissions = [];
                        this.modules = [];
                        this.isAuthenticated = true;
                        log('AuthContext - Usuario establecido correctamente');
                    } else {
                        log('AuthContext - No se pudieron obtener datos del usuario');
                        realAuthService.logout();
                        this.isAuthenticated = false;
                    }
                } else {
                    log('AuthContext - Usuario no autenticado');
                    this.isAuthenticated = false;
                }
                
                this.isLoading = false;
                log('AuthContext - Inicialización completada');
            }
            
            async login(username, password) {
                log('=== AuthContext.login() INICIADO ===');
                this.isLoading = true;
                
                try {
                    const response = await realAuthService.login({ username, password });
                    
                    if (response.success && response.data) {
                        this.user = response.data.user;
                        this.roles = response.data.roles || [];
                        this.permissions = [];
                        this.modules = [];
                        this.isAuthenticated = true;
                        
                        log('AuthContext - Login exitoso, usuario establecido');
                        return response.data.user;
                    } else {
                        throw new Error(response.message || 'Error en el login');
                    }
                } catch (error) {
                    log(`AuthContext - Error en login: ${error.message}`);
                    throw error;
                } finally {
                    this.isLoading = false;
                }
            }
        }
        
        const mockAuthContext = new MockAuthContext();
        
        async function simulateRealLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            log('=== SIMULACIÓN COMPLETA DEL LOGIN REAL ===');
            
            try {
                // Paso 1: Login a través del AuthContext (como hace el frontend real)
                const user = await mockAuthContext.login(username, password);
                
                log('=== SIMULANDO LÓGICA DEL LOGINFORM ===');
                
                // Paso 2: Simular la lógica de redirección del LoginForm
                if (user.requiere_cambio_password) {
                    log('LoginForm - Redirigiendo a /cambiar-password (requiere_cambio_password)');
                    document.getElementById('navigationState').innerHTML = `
                        <div class="warning">
                            <strong>Redirección:</strong> /cambiar-password<br>
                            <strong>Motivo:</strong> requiere_cambio_password = true
                        </div>
                    `;
                } else if (user.username === 'admin') {
                    log('LoginForm - Redirigiendo a /cambiar-password (usuario admin)');
                    document.getElementById('navigationState').innerHTML = `
                        <div class="warning">
                            <strong>Redirección:</strong> /cambiar-password<br>
                            <strong>Motivo:</strong> usuario = admin
                        </div>
                    `;
                } else {
                    log('LoginForm - Redirigiendo a /dashboard');
                    document.getElementById('navigationState').innerHTML = `
                        <div class="success">
                            <strong>Redirección:</strong> /dashboard<br>
                            <strong>Motivo:</strong> login normal
                        </div>
                    `;
                }
                
                log('=== LOGIN REAL COMPLETADO EXITOSAMENTE ===');
                checkCurrentState();
                
            } catch (error) {
                log(`ERROR EN SIMULACIÓN REAL: ${error.message}`);
                document.getElementById('navigationState').innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
            }
        }
        
        async function testAuthServiceDirectly() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            log('=== PRUEBA DIRECTA DEL AUTHSERVICE ===');
            
            try {
                const response = await realAuthService.login({ username, password });
                log('AuthService directo - Éxito');
                checkCurrentState();
            } catch (error) {
                log(`AuthService directo - Error: ${error.message}`);
            }
        }
        
        function checkCurrentState() {
            log('=== VERIFICANDO ESTADO ACTUAL ===');
            
            const isAuth = realAuthService.isAuthenticated();
            const userData = realAuthService.getUserData();
            const accessToken = getCookie('access_token');
            const refreshToken = getCookie('refresh_token');
            const localStorageData = localStorage.getItem('user_data');
            
            const stateInfo = `
Estado de Autenticación:
• isAuthenticated(): ${isAuth}
• Usuario en contexto: ${mockAuthContext.user ? mockAuthContext.user.username : 'Ninguno'}
• Autenticado en contexto: ${mockAuthContext.isAuthenticated}

Cookies:
• access_token: ${accessToken ? 'Presente' : 'Ausente'}
• refresh_token: ${refreshToken ? 'Presente' : 'Ausente'}

LocalStorage:
• user_data: ${localStorageData ? 'Presente' : 'Ausente'}

Datos de Usuario:
${userData ? JSON.stringify(userData, null, 2) : 'Sin datos'}`;
            
            document.getElementById('currentState').textContent = stateInfo;
            log('Estado verificado');
        }
        
        function testNavigation() {
            log('=== PROBANDO NAVEGACIÓN ===');
            
            if (mockAuthContext.isAuthenticated && mockAuthContext.user) {
                const user = mockAuthContext.user;
                
                if (user.requiere_cambio_password) {
                    log('Navegación: /cambiar-password (requiere cambio)');
                } else if (user.username === 'admin') {
                    log('Navegación: /cambiar-password (usuario admin)');
                } else {
                    log('Navegación: /dashboard');
                }
            } else {
                log('Navegación: No autenticado, permanece en login');
            }
        }
        
        function clearAll() {
            realAuthService.logout();
            mockAuthContext.user = null;
            mockAuthContext.roles = [];
            mockAuthContext.isAuthenticated = false;
            document.getElementById('currentState').textContent = '';
            document.getElementById('navigationState').innerHTML = '';
            log('=== TODO LIMPIADO ===');
        }
        
        // Verificar estado inicial
        window.onload = function() {
            log('=== PÁGINA CARGADA ===');
            checkCurrentState();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug AuthContext Frontend</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        .info { background: #d1ecf1; }
        .warning { background: #fff3cd; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0056b3; }
        button.danger { background: #dc3545; }
        button.danger:hover { background: #c82333; }
        input {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .log {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .status-item {
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h1>Debug AuthContext Frontend</h1>
    
    <div class="container">
        <h3>Simulación del Flujo de Login</h3>
        <input type="text" id="username" placeholder="Usuario" value="admin">
        <input type="password" id="password" placeholder="Contraseña" value="admin">
        <button onclick="simulateLogin()">Simular Login Completo</button>
        <button onclick="clearAll()" class="danger">Limpiar Todo</button>
        <button onclick="clearLogs()">Limpiar Logs</button>
    </div>

    <div class="status-grid">
        <div class="container">
            <h3>Estado de Cookies</h3>
            <button onclick="checkCookies()">Verificar Cookies</button>
            <button onclick="clearCookies()" class="danger">Limpiar Cookies</button>
            <div id="cookieStatus" class="status-item"></div>
        </div>

        <div class="container">
            <h3>Estado de LocalStorage</h3>
            <button onclick="checkLocalStorage()">Verificar LocalStorage</button>
            <button onclick="clearLocalStorage()" class="danger">Limpiar LocalStorage</button>
            <div id="localStorageStatus" class="status-item"></div>
        </div>
    </div>

    <div class="container">
        <h3>Simulación de AuthContext</h3>
        <button onclick="simulateAuthContextInit()">Simular Inicialización AuthContext</button>
        <button onclick="testIsAuthenticated()">Probar isAuthenticated()</button>
        <button onclick="testGetUserData()">Probar getUserData()</button>
        <div id="authContextStatus" class="status-item"></div>
    </div>

    <div class="container">
        <h3>Logs de Debug</h3>
        <div id="logs" class="log"></div>
    </div>

    <script>
        let logContainer = document.getElementById('logs');
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}\n`;
            logContainer.textContent += logEntry;
            logContainer.scrollTop = logContainer.scrollHeight;
            console.log(message);
        }
        
        function clearLogs() {
            logContainer.textContent = '';
        }
        
        // Funciones de utilidad para cookies (copiadas del frontend)
        function setCookie(name, value, days = 7) {
            const expires = new Date();
            expires.setTime(expires.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${value};expires=${expires.toUTCString()};path=/;SameSite=Lax`;
        }
        
        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }
        
        function deleteCookie(name) {
            document.cookie = `${name}=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;`;
        }
        
        function hasAuthCookies() {
            return getCookie('access_token') !== null && getCookie('refresh_token') !== null;
        }
        
        function clearAuthCookies() {
            deleteCookie('access_token');
            deleteCookie('refresh_token');
        }
        
        // Simulación del AuthService
        class MockAuthService {
            constructor() {
                this.token = null;
                if (hasAuthCookies()) {
                    this.token = getCookie('access_token');
                }
            }
            
            async login(credentials) {
                log('MockAuthService.login() - Iniciando...');
                
                try {
                    const response = await fetch('http://127.0.0.1:8000/api/v1/auth/login/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(credentials),
                        credentials: 'include'
                    });
                    
                    const data = await response.json();
                    log(`MockAuthService.login() - Respuesta: ${response.status}`);
                    
                    if (response.ok && data.success) {
                        const { access, refresh, user, roles } = data.data;
                        
                        log('MockAuthService.login() - Generando cookies...');
                        setCookie('access_token', access, 1);
                        setCookie('refresh_token', refresh, 7);
                        
                        this.token = access;
                        
                        const userData = {
                            user: user,
                            roles: roles || [],
                            permissions: [],
                            modules: []
                        };
                        localStorage.setItem('user_data', JSON.stringify(userData));
                        
                        log('MockAuthService.login() - Login exitoso');
                        return data;
                    } else {
                        log(`MockAuthService.login() - Error: ${data.message}`);
                        return data;
                    }
                } catch (error) {
                    log(`MockAuthService.login() - Error de conexión: ${error.message}`);
                    throw error;
                }
            }
            
            isAuthenticated() {
                const userData = localStorage.getItem('user_data');
                const hasValidCookies = hasAuthCookies();
                const result = userData !== null && hasValidCookies;
                log(`MockAuthService.isAuthenticated() - userData: ${userData ? 'Presente' : 'Ausente'}, cookies: ${hasValidCookies ? 'Válidas' : 'Inválidas'}, resultado: ${result}`);
                return result;
            }
            
            getUserData() {
                const userData = localStorage.getItem('user_data');
                const result = userData ? JSON.parse(userData) : null;
                log(`MockAuthService.getUserData() - ${result ? 'Datos encontrados' : 'Sin datos'}`);
                return result;
            }
        }
        
        const mockAuthService = new MockAuthService();
        
        async function simulateLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            log('=== SIMULANDO LOGIN COMPLETO ===');
            
            try {
                // Paso 1: Login
                const response = await mockAuthService.login({ username, password });
                
                if (response.success) {
                    log('Paso 1: Login exitoso');
                    
                    // Paso 2: Verificar estado después del login
                    log('Paso 2: Verificando estado post-login...');
                    checkCookies();
                    checkLocalStorage();
                    
                    // Paso 3: Simular inicialización del AuthContext
                    log('Paso 3: Simulando AuthContext...');
                    simulateAuthContextInit();
                    
                    log('=== LOGIN COMPLETO EXITOSO ===');
                } else {
                    log(`ERROR EN LOGIN: ${response.message}`);
                }
            } catch (error) {
                log(`ERROR EN SIMULACIÓN: ${error.message}`);
            }
        }
        
        function simulateAuthContextInit() {
            log('=== SIMULANDO INICIALIZACIÓN AUTHCONTEXT ===');
            
            // Simular el useEffect del AuthContext
            log('AuthContext - Inicializando contexto de autenticación');
            
            if (mockAuthService.isAuthenticated()) {
                const userData = mockAuthService.getUserData();
                if (userData) {
                    log('AuthContext - Datos de usuario encontrados:', userData);
                    log('AuthContext - Usuario establecido correctamente');
                    
                    document.getElementById('authContextStatus').innerHTML = `
                        <div class="success">
                            <strong>AuthContext Inicializado Correctamente</strong><br>
                            Usuario: ${userData.user.username}<br>
                            Roles: ${userData.roles.length}<br>
                            Autenticado: SÍ
                        </div>
                    `;
                } else {
                    log('AuthContext - No se pudieron obtener datos del usuario');
                    mockAuthService.logout();
                    
                    document.getElementById('authContextStatus').innerHTML = `
                        <div class="error">
                            <strong>Error en AuthContext</strong><br>
                            No se pudieron obtener datos del usuario
                        </div>
                    `;
                }
            } else {
                log('AuthContext - Usuario no autenticado');
                
                document.getElementById('authContextStatus').innerHTML = `
                    <div class="warning">
                        <strong>AuthContext</strong><br>
                        Usuario no autenticado
                    </div>
                `;
            }
            
            log('AuthContext - Inicialización completada');
        }
        
        function testIsAuthenticated() {
            log('=== PROBANDO isAuthenticated() ===');
            const result = mockAuthService.isAuthenticated();
            log(`Resultado: ${result}`);
        }
        
        function testGetUserData() {
            log('=== PROBANDO getUserData() ===');
            const result = mockAuthService.getUserData();
            log(`Resultado: ${result ? JSON.stringify(result, null, 2) : 'null'}`);
        }
        
        function checkCookies() {
            const accessToken = getCookie('access_token');
            const refreshToken = getCookie('refresh_token');
            const hasAuth = hasAuthCookies();
            
            const status = `
Estado de Cookies:
• Access Token: ${accessToken ? 'Presente' : 'Ausente'}
• Refresh Token: ${refreshToken ? 'Presente' : 'Ausente'}
• Autenticación válida: ${hasAuth ? 'SÍ' : 'NO'}

Todas las cookies: ${document.cookie || 'Ninguna'}`;
            
            document.getElementById('cookieStatus').textContent = status;
            log('Cookies verificadas: ' + (hasAuth ? 'Válidas' : 'Inválidas'));
        }
        
        function clearCookies() {
            clearAuthCookies();
            log('Cookies de autenticación eliminadas');
            checkCookies();
        }
        
        function checkLocalStorage() {
            const userData = localStorage.getItem('user_data');
            const status = `
Estado de LocalStorage:
• user_data: ${userData ? 'Presente' : 'Ausente'}

Contenido: ${userData || 'Vacío'}`;
            
            document.getElementById('localStorageStatus').textContent = status;
            log('LocalStorage verificado: ' + (userData ? 'Con datos' : 'Vacío'));
        }
        
        function clearLocalStorage() {
            localStorage.removeItem('user_data');
            log('LocalStorage limpiado');
            checkLocalStorage();
        }
        
        function clearAll() {
            clearCookies();
            clearLocalStorage();
            document.getElementById('authContextStatus').innerHTML = '';
            log('=== TODO LIMPIADO ===');
        }
        
        // Verificar estado inicial
        window.onload = function() {
            log('=== PÁGINA CARGADA ===');
            checkCookies();
            checkLocalStorage();
            simulateAuthContextInit();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login</title>
</head>
<body>
    <h1>Test de Login</h1>
    <button onclick="testLogin()">Hacer Login</button>
    <button onclick="checkAuth()">Verificar Autenticación</button>
    <button onclick="clearAuth()">Limpiar Autenticación</button>
    <div id="result"></div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000/api/v1';
        
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Haciendo login...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/login/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin123'
                    })
                });
                
                const data = await response.json();
                console.log('Login response:', data);
                
                if (data.success) {
                    // Guardar en localStorage
                    localStorage.setItem('auth_token', data.data.access);
                    localStorage.setItem('user_data', JSON.stringify(data.data));
                    
                    resultDiv.innerHTML = `
                        <h3>Login exitoso!</h3>
                        <p>Usuario: ${data.data.user.username}</p>
                        <p>Token guardado en localStorage</p>
                        <p>Ahora puedes ir a <a href="/empleados" target="_blank">la página de empleados</a></p>
                    `;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">Error: ${data.message}</p>`;
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `<p style="color: red;">Error de conexión: ${error.message}</p>`;
            }
        }
        
        function checkAuth() {
            const token = localStorage.getItem('auth_token');
            const userData = localStorage.getItem('user_data');
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = `
                <h3>Estado de Autenticación:</h3>
                <p><strong>Token:</strong> ${token ? 'Presente' : 'No encontrado'}</p>
                <p><strong>User Data:</strong> ${userData ? 'Presente' : 'No encontrado'}</p>
                ${token ? `<p><strong>Token:</strong> ${token.substring(0, 50)}...</p>` : ''}
            `;
            
            console.log('Auth Token:', token);
            console.log('User Data:', userData);
        }
        
        function clearAuth() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user_data');
            document.getElementById('result').innerHTML = '<p>Autenticación limpiada</p>';
        }
    </script>
</body>
</html>

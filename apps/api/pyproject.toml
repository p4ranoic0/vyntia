[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vyntia-api"
version = "0.1.0"
description = "VYNTIA API — backend Django del SaaS modular de RRHH para Perú"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "VYNTIA team" },
]

dependencies = [
    # Core Django
    "Django>=5.2,<5.3",
    "djangorestframework>=3.14.0",
    "djangorestframework-simplejwt>=5.2.0",
    "django-cors-headers>=4.0.0",
    "django-filter>=23.0",
    "django-extensions>=3.2.0",

    # Database
    "psycopg2-binary>=2.9.0",

    # API documentation
    "drf-spectacular>=0.26.0",

    # Production
    "gunicorn>=20.1.0",
    "whitenoise>=6.0.0",

    # Monitoring
    "sentry-sdk>=1.25.0",

    # Utilities
    "Pillow>=9.0.0",
    "python-decouple>=3.6",
    "celery>=5.2.0",
    "redis>=4.5.0",
    "django-redis>=5.4.0",
    "hiredis>=2.2.0",

    # PDF generation
    "reportlab>=4.0.0",
    "xhtml2pdf>=0.2.17",
    "weasyprint>=60.0",
    "jinja2>=3.1.0",

    # Excel
    "openpyxl>=3.1.0",

    # Storage
    "django-storages[s3]>=1.14.0",
    "boto3>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "ipython>=8.0.0",
    "pytest>=7.0.0",
    "pytest-django>=4.5.0",
    "pytest-cov>=4.0.0",
    "pytest-html>=3.1.0",
    "pytest-xdist>=3.0.0",
    "factory-boy>=3.2.0",
    "faker>=18.0.0",
]

[tool.setuptools]
# Backend package layout. `apps` namespace contiene bounded contexts (L3+).
# Cada nueva app L3.X (identity, organization, employees, ...) se anade aqui.
packages = ["vyntia", "app_rrhh", "api", "apps", "apps.core", "apps.identity", "apps.organization", "apps.employees"]
include-package-data = true
